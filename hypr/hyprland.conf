# ─────────────────────────────────────────────────────────────
#  Madar — Hyprland base config
#  Target: ThinkPad E16 Gen 2 (Intel Arc) · Ubuntu 26.04 · Hyprland 0.53
#  Location: ~/.config/hypr/hyprland.conf
# ─────────────────────────────────────────────────────────────

# ── Display ──────────────────────────────────────────────────
# 16" 1920x1200 panel. Change the last number to 1.25 if text feels small.
monitor = , preferred, auto, 1

# ── Environment ──────────────────────────────────────────────
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = GDK_BACKEND, wayland,x11
env = MOZ_ENABLE_WAYLAND, 1
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = QS_ICON_THEME, WhiteSur    # icon theme used by the Madar shell
env = GSK_RENDERER, gl       # GTK4 apps (Loupe, Settings…) draw with OpenGL; Vulkan shows blank windows here

# ── Programs ─────────────────────────────────────────────────
$terminal    = kitty
$fileManager = nautilus
$menu        = quickshell ipc call launcher toggle   # Madar launcher

# ── Autostart ────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd --all
exec-once = quickshell       # Madar shell (~/.config/quickshell)
exec-once = wl-paste --type text  --watch cliphist store    # clipboard history
exec-once = wl-paste --type image --watch cliphist store
# hide the 'hyprland-guiutils not installed' banner (package isn't in Ubuntu 26.04)
exec-once = sleep 4 && hyprctl dismissnotify

# ── Look & feel ──────────────────────────────────────────────
general {
    gaps_in  = 6
    gaps_out = 12
    border_size = 0                 # no coloured frame around windows

    # grab a window edge to resize it, even without a visible border
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true

    # floating windows stick to screen edges and to each other while dragging
    snap {
        enabled = true
        window_gap = 12
        monitor_gap = 12
    }

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 16

    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }
}

# Smooth, slightly springy motion
animations {
    enabled = true

    bezier = smooth,   0.25, 1,    0.5, 1
    bezier = snappy,   0.2,  0.9,  0.1, 1.05
    bezier = fade,     0.3,  0,    0.2, 1

    animation = windows,     1, 5, snappy, popin 88%
    animation = windowsOut,  1, 4, smooth, popin 90%
    animation = windowsMove, 1, 5, snappy
    animation = border,      1, 8, fade
    animation = fade,        1, 4, fade
    animation = layers,      1, 4, smooth, fade
    animation = workspaces,  1, 5, smooth, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    # if the shell ever restarts while locked, let it take the lock back
    allow_session_lock_restore = true
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0b0d12)
    focus_on_activate = true
}

# Never jump the mouse pointer to a window when it gets focus
cursor {
    no_warps = true
}

# ── Windows float freely by default ─────────────────────────
# Super + T puts a window into tiling (side-by-side) mode, and back.
windowrule = match:class .*, float on

# A maximized window fills all the space next to the rail: no gaps, no rounded corners
workspace = f[1], gapsout:0, gapsin:0, rounding:false

# ── Keyboard, touchpad & Arabic support ──────────────────────
input {
    # English first, Arabic second
    kb_layout  = us,ara
    kb_variant =
    # Alt + Shift switches between English and Arabic
    kb_options = grp:alt_shift_toggle

    follow_mouse = 2                # click a window to focus it (like Windows / Ubuntu)
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

# 3-finger swipe left/right to change workspace
gesture = 3, horizontal, workspace

# ── Key bindings ─────────────────────────────────────────────
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, Q,      exec, $terminal
bind = $mod, E,      exec, $fileManager
bind = $mod, D,      exec, $menu
bind = $mod, A,      exec, $menu
bind = $mod, N,      exec, quickshell ipc call controlcenter toggle
bind = $mod, L,      exec, quickshell ipc call lock lock
bind = $mod, C,      killactive,
bind = $mod SHIFT, M, exit,
bind = $mod, T,      togglefloating,
bind = $mod, V,      exec, quickshell ipc call clipboard toggle      # clipboard history
bind = $mod, F,      fullscreen, 0
bind = $mod, up,     exec, ~/.config/quickshell/scripts/max.sh toggle   # maximize / restore
bind = $mod, M,      movetoworkspacesilent, special:minimized       # minimize

# Tap Super alone (or Super + Tab) → overview of all open windows
bindr = $mod, SUPER_L, exec, quickshell ipc call overview toggle
bind  = $mod, Tab,     exec, quickshell ipc call overview toggle

# Alt + Tab switcher (most recent first) — handled inside the shell
bind = ALT,       Tab, global, quickshell:switcherNext
bind = ALT SHIFT, Tab, global, quickshell:switcherPrev
bind = $mod, P,      pseudo,
bind = $mod, J,      togglesplit,

# Switch keyboard language with Super + Space as well
bind = $mod, SPACE, exec, hyprctl switchxkblayout all next

# Windows-style snapping: half screen left/right, Super+Down restores, Super+Up maximizes (see scripts/max.sh)
$snap = ~/.config/quickshell/scripts/snap.sh
bind = $mod, left,  exec, $snap left
bind = $mod, right, exec, $snap right
bind = $mod, down,  exec, $snap restore

# Move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Scratchpad
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Drag / resize with Super + mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots → ~/Pictures/Screenshots + clipboard + notification
$shot = ~/.config/quickshell/scripts/screenshot.sh
bind = ,           Print, exec, $shot region     # pick an area
bind = $mod SHIFT, S,     exec, $shot region
bind = CTRL,       Print, exec, $shot window     # window in front
bind = SHIFT,      Print, exec, $shot full       # whole screen

# ── Laptop keys ──────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+ && quickshell ipc call osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && quickshell ipc call osd brightness
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

# Lock when the lid closes
bindl = , switch:on:Lid Switch, exec, quickshell ipc call lock lock
