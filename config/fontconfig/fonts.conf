<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Madar — font setup
  Location: ~/.config/fontconfig/fonts.conf
  English UI in Inter, Arabic text falls back to Noto Sans Arabic.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans Arabic</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Naskh Arabic</family>
    </prefer>
  </alias>
  <!--
    Windows / Office fonts → look-alikes with the same letter widths, so pages
    break in the same places. Used only when the real font isn't installed
    (run `madar-fonts` to copy the real ones from Windows).
    Note: OnlyOffice picks its own replacements; this helps every other app.
  -->
  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Caladea</family></accept></alias>
  <alias binding="same"><family>Arial</family><accept><family>Liberation Sans</family><family>Noto Sans Arabic</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>Liberation Serif</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Liberation Mono</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Inter</family><family>Noto Sans Arabic</family></accept></alias>
  <alias binding="same"><family>Tahoma</family><accept><family>DejaVu Sans</family><family>Noto Sans Arabic</family></accept></alias>
  <alias binding="same"><family>Simplified Arabic</family><accept><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>Traditional Arabic</family><accept><family>Amiri</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>Arabic Typesetting</family><accept><family>Amiri</family></accept></alias>
  <alias binding="same"><family>Sakkal Majalla</family><accept><family>Amiri</family><family>Noto Naskh Arabic</family></accept></alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>
</fontconfig>
